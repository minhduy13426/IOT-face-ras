<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Đăng nhập - FaceDF Hệ thống điểm danh thông minh" />
  <title>FaceDF — Đăng Nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    /* ══════════════════════════════════════════════════════════════
       FaceDF — login.html | Trang đăng nhập standalone
    ══════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --bg2: #1a1d27;
      --bg3: #22263a;
      --border: rgba(255,255,255,0.08);
      --text: #e8eaf0;
      --text2: #9ba3b8;
      --purple: #7c5fe6;
      --purple-light: #9d7ff0;
      --purple-glow: rgba(124,95,230,0.25);
      --green: #22c55e;
      --red: #ef4444;
      --input-bg: rgba(255,255,255,0.05);
      --input-border: rgba(255,255,255,0.12);
      --input-focus: rgba(124,95,230,0.5);
      --radius: 12px;
      --shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Gradient background trang trí */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(124,95,230,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(34,197,94,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── Login Card ── */
    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 24px 16px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: var(--shadow), 0 0 60px var(--purple-glow);
    }

    /* ── Logo & Brand ── */
    .login-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px var(--purple-glow);
      flex-shrink: 0;
    }

    .login-logo svg {
      width: 28px;
      height: 28px;
      color: white;
      stroke: white;
    }

    .login-brand-text .brand-name {
      display: block;
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(90deg, #fff 0%, var(--purple-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .login-brand-text .brand-sub {
      display: block;
      font-size: 12px;
      color: var(--text2);
      font-weight: 400;
      margin-top: 2px;
    }

    /* ── Heading ── */
    .login-heading {
      margin-bottom: 28px;
    }

    .login-heading h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .login-heading p {
      font-size: 13px;
      color: var(--text2);
    }

    /* ── Form ── */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      letter-spacing: 0.3px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .input-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text2);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .input-wrap input::placeholder {
      color: rgba(155,163,184,0.5);
    }

    .input-wrap input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px var(--input-focus);
      background: rgba(124,95,230,0.05);
    }

    .input-wrap input:focus + .input-icon,
    .input-wrap input:focus ~ .input-icon {
      color: var(--purple-light);
    }

    /* ── Submit Button ── */
    .btn-login {
      margin-top: 4px;
      padding: 13px 24px;
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      border: none;
      border-radius: var(--radius);
      color: white;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 16px var(--purple-glow);
      width: 100%;
    }

    .btn-login:hover:not(:disabled) {
      opacity: 0.92;
      box-shadow: 0 6px 24px var(--purple-glow);
    }

    .btn-login:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ── Spinner ── */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error banner ── */
    .login-error {
      display: none;
      padding: 11px 14px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius);
      color: #f87171;
      font-size: 13px;
      align-items: center;
      gap: 8px;
    }

    .login-error.show { display: flex; }

    /* ── Footer info ── */
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text2);
    }

    .login-footer a {
      color: var(--purple-light);
      text-decoration: none;
    }

    /* ── Mobile responsive ── */
    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
      }

      .login-wrapper {
        padding: 16px 12px;
      }
    }

    /* ── Loading overlay ── */
    .full-loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .full-loading .spinner {
      width: 36px;
      height: 36px;
      border-width: 3px;
    }
  </style>
</head>

<body>

  <!-- Loading khi kiểm tra token -->
  <div class="full-loading" id="fullLoading">
    <div class="spinner"></div>
  </div>

  <div class="login-wrapper" id="loginWrapper" style="display:none">
    <div class="login-card">

      <!-- Brand Logo -->
      <div class="login-brand">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" />
            <circle cx="12" cy="10" r="3" />
            <path d="M6 20c0-2.2 2.7-4 6-4s6 1.8 6 4" />
          </svg>
        </div>
        <div class="login-brand-text">
          <span class="brand-name">FaceDF</span>
          <span class="brand-sub">Điểm Danh Thông Minh</span>
        </div>
      </div>

      <!-- Tiêu đề -->
      <div class="login-heading">
        <h1>Đăng nhập quản trị</h1>
        <p>Nhập thông tin tài khoản để truy cập hệ thống</p>
      </div>

      <!-- Thông báo lỗi -->
      <div class="login-error" id="loginError">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
        <span id="loginErrorMsg">Đăng nhập thất bại</span>
      </div>

      <!-- Form đăng nhập -->
      <form class="login-form" id="loginForm" novalidate>

        <!-- Mã tổ chức -->
        <div class="form-group">
          <label for="tenantCode">Mã tổ chức</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <rect x="2" y="7" width="20" height="14" rx="2" />
                <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
              </svg>
            </span>
            <input type="text" id="tenantCode" name="tenant_code" placeholder="VD: UIT_CE"
              autocomplete="organization" required />
          </div>
        </div>

        <!-- Tên đăng nhập -->
        <div class="form-group">
          <label for="username">Tên đăng nhập</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input type="text" id="username" name="username" placeholder="admin"
              autocomplete="username" required />
          </div>
        </div>

        <!-- Mật khẩu -->
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="••••••••"
              autocomplete="current-password" required />
          </div>
        </div>

        <!-- Nút đăng nhập -->
        <button type="submit" class="btn-login" id="loginBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
            <polyline points="10 17 15 12 10 7" />
            <line x1="15" y1="12" x2="3" y2="12" />
          </svg>
          Đăng nhập
        </button>

      </form>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      FaceDF &copy; 2024 — Đồ án 2 UIT &middot; CE334 AIoT
    </div>
  </div>

  <script>
    /* ══════════════════════════════════════════════════════════════
       FaceDF — login.js (inline)
       Xử lý đăng nhập, kiểm tra token, redirect
    ══════════════════════════════════════════════════════════════ */

    const API_BASE = '';  // Cùng origin với backend

    // Kiểm tra nếu đã có token thì chuyển thẳng sang index.html
    (function checkExistingToken() {
      const token = localStorage.getItem('facedf-token');
      if (token) {
        // Redirect sang trang chính
        window.location.replace('index.html');
        return;
      }
      // Hiện form đăng nhập
      document.getElementById('fullLoading').style.display = 'none';
      document.getElementById('loginWrapper').style.display = '';
    })();

    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const loginErrorMsg = document.getElementById('loginErrorMsg');

    // Hiển thị thông báo lỗi
    function showError(msg) {
      loginErrorMsg.textContent = msg;
      loginError.classList.add('show');
    }

    // Ẩn thông báo lỗi
    function hideError() {
      loginError.classList.remove('show');
    }

    // Đặt trạng thái đang loading
    function setLoading(loading) {
      loginBtn.disabled = loading;
      if (loading) {
        loginBtn.innerHTML = `<div class="spinner"></div> Đang đăng nhập...`;
      } else {
        loginBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Đăng nhập`;
      }
    }

    // Xử lý submit form đăng nhập
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const tenantCode = document.getElementById('tenantCode').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // Kiểm tra input cơ bản
      if (!tenantCode || !username || !password) {
        showError('Vui lòng điền đầy đủ thông tin đăng nhập.');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tenant_code: tenantCode, username, password }),
        });

        const json = await res.json().catch(() => ({}));

        if (!res.ok) {
          // Xử lý lỗi từ server
          const errMsg = json.detail || `Đăng nhập thất bại (${res.status})`;
          showError(errMsg);
          return;
        }

        // Lưu token và thông tin tổ chức vào localStorage
        localStorage.setItem('facedf-token', json.access_token);
        localStorage.setItem('facedf-tenant-name', json.tenant_name || tenantCode);

        // Redirect sang trang chính
        window.location.replace('index.html');

      } catch (err) {
        showError('Không thể kết nối đến máy chủ. Vui lòng thử lại.');
      } finally {
        setLoading(false);
      }
    });

    // Ẩn lỗi khi người dùng bắt đầu gõ lại
    ['tenantCode', 'username', 'password'].forEach(id => {
      document.getElementById(id).addEventListener('input', hideError);
    });
  </script>

</body>

</html>
